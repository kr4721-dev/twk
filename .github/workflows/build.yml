name: Build Tweak
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git dpkg-dev
          git clone --recursive https://github.com/theos/theos.git /opt/theos
      - name: Build deb
        run: |
          export THEOS=/opt/theos
          make package
      - name: Setup Repo
        run: |
          mkdir -p debs
          cp packages/*.deb debs/
          dpkg-scanpackages -m debs > Packages
          gzip -9c Packages > Packages.gz
          echo "Origin: Repo" > Release
          echo "Label: Repo" >> Release
          echo "Suite: stable" >> Release
          echo "Version: 1.0" >> Release
          echo "Codename: ios" >> Release
          echo "Architectures: iphoneos-arm iphoneos-arm64" >> Release
          echo "Components: main" >> Release
          echo "Description: Repo" >> Release
          apt-ftparchive packages debs > Packages
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto build deb"
          file_pattern: "debs/*.deb Packages Packages.gz Release"